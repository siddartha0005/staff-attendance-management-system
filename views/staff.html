<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard — Staff Attendance</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="toast-container"></div>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">🏢</div>
        <h2>Staff Attendance</h2>
        <p>Staff Portal</p>
      </div>
      <nav class="sidebar-nav">
        <a href="/staff" class="nav-item active">
          <span class="nav-icon">🏠</span> Dashboard
        </a>
        <a href="/my-attendance" class="nav-item">
          <span class="nav-icon">📋</span> My Attendance
        </a>
        <a href="/my-profile" class="nav-item">
          <span class="nav-icon">👤</span> My Profile
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">S</div>
          <div>
            <div class="user-name" id="user-name">Staff</div>
            <div class="user-role">Staff Member</div>
          </div>
        </div>
        <button class="btn-logout" id="logout-btn">🚪 Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <h1>My Dashboard</h1>
        <span class="date" id="current-date"></span>
      </div>

      <div class="page-content">

        <!-- Welcome + Stats -->
        <div class="stats-grid" style="margin-bottom:24px;">
          <div class="stat-card">
            <div class="stat-icon green">✅</div>
            <div><div class="stat-value" id="stat-present">—</div><div class="stat-label">Days Present</div></div>
          </div>
          <div class="stat-card">
            <div class="stat-icon red">❌</div>
            <div><div class="stat-value" id="stat-absent">—</div><div class="stat-label">Days Absent</div></div>
          </div>
          <div class="stat-card">
            <div class="stat-icon blue">⏱️</div>
            <div><div class="stat-value" id="stat-checkedin">—</div><div class="stat-label">Today's Status</div></div>
          </div>
        </div>

        <!-- Check In / Out Card -->
        <div class="attendance-card">
          <h2 style="margin-bottom:8px;">Welcome, <span id="welcome-name">—</span></h2>
          <p style="color:var(--text-light); margin-bottom:20px;" id="today-label"></p>

          <div id="attendance-status-badge"></div>

          <div class="attendance-times">
            <div class="time-block">
              <div class="time-label">Check-In</div>
              <div class="time-value" id="checkin-time">—</div>
            </div>
            <div class="time-block">
              <div class="time-label">Check-Out</div>
              <div class="time-value" id="checkout-time">—</div>
            </div>
            <div class="time-block">
              <div class="time-label">Duration</div>
              <div class="time-value" id="duration">—</div>
            </div>
          </div>

          <div id="alert-box"></div>

          <div class="action-buttons">
            <button class="btn btn-success" id="checkin-btn">✅ Check In</button>
            <button class="btn btn-danger"  id="checkout-btn">🚪 Check Out</button>
          </div>
        </div>

        <!-- Recent History (last 5) -->
        <div class="card">
          <div class="card-header">
            <h2>Recent Attendance</h2>
            <a href="/my-attendance" class="btn btn-outline btn-sm">View All →</a>
          </div>
          <div class="table-wrap">
            <div id="history-container">
              <div class="loading"><div class="spinner"></div><p>Loading...</p></div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/staff.js"></script>
</body>
</html>

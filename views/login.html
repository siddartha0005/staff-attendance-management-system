<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Staff Attendance</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <div class="icon">🏢</div>
        <h1>Staff Attendance</h1>
        <p>Management System</p>
      </div>

      <div id="alert-box"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="identifier">Email or Employee ID</label>
          <input type="text" id="identifier" placeholder="admin@company.com or EMP001" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:12px;" id="login-btn">
          Sign In
        </button>
      </form>

      <p style="text-align:center; margin-top:20px; font-size:12px; color:#7f8c8d;">
        Demo: admin@company.com / Admin@123
      </p>
    </div>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Staff — Staff Attendance</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="toast-container"></div>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">🏢</div>
        <h2>Staff Attendance</h2>
        <p>Admin Panel</p>
      </div>
      <nav class="sidebar-nav">
        <a href="/admin" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="/staff-management" class="nav-item active"><span class="nav-icon">👥</span> Staff Management</a>
        <a href="/attendance" class="nav-item"><span class="nav-icon">📋</span> Attendance</a>
        <a href="/reports" class="nav-item"><span class="nav-icon">📈</span> Reports</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">A</div>
          <div>
            <div class="user-name" id="user-name">Admin</div>
            <div class="user-role">Administrator</div>
          </div>
        </div>
        <button class="btn-logout" id="logout-btn">🚪 Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <h1>Add New Staff</h1>
        <a href="/staff-management" class="btn btn-outline">← Back</a>
      </div>

      <div class="page-content">
        <div class="card" style="max-width:720px;">
          <div class="card-header"><h2>Staff Information</h2></div>
          <div class="card-body">
            <div id="alert-box"></div>
            <form id="add-staff-form">
              <div class="form-grid">
                <div class="form-group">
                  <label>Employee ID *</label>
                  <input type="text" name="employee_id" placeholder="EMP001" required>
                </div>
                <div class="form-group">
                  <label>Full Name *</label>
                  <input type="text" name="name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                  <label>Email Address *</label>
                  <input type="email" name="email" placeholder="john@company.com" required>
                </div>
                <div class="form-group">
                  <label>Phone Number</label>
                  <input type="tel" name="phone" placeholder="9876543210">
                </div>
                <div class="form-group">
                  <label>Department *</label>
                  <input type="text" name="department" placeholder="Engineering" required>
                </div>
                <div class="form-group">
                  <label>Designation</label>
                  <input type="text" name="designation" placeholder="Software Engineer">
                </div>
                <div class="form-group">
                  <label>Password *</label>
                  <input type="password" name="password" placeholder="Minimum 6 characters" required minlength="6">
                </div>
                <div class="form-group">
                  <label>Joining Date</label>
                  <input type="date" name="joining_date">
                </div>
              </div>
              <div style="display:flex; gap:12px; margin-top:8px;">
                <button type="submit" class="btn btn-primary" id="submit-btn">➕ Add Staff Member</button>
                <a href="/staff-management" class="btn btn-outline">Cancel</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/add-staff.js"></script>
</body>
</html>

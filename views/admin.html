<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Staff Attendance</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="toast-container"></div>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">🏢</div>
        <h2>Staff Attendance</h2>
        <p>Admin Panel</p>
      </div>
      <nav class="sidebar-nav">
        <a href="/admin" class="nav-item active">
          <span class="nav-icon">📊</span> Dashboard
        </a>
        <a href="/staff-management" class="nav-item">
          <span class="nav-icon">👥</span> Staff Management
        </a>
        <a href="/attendance" class="nav-item">
          <span class="nav-icon">📋</span> Attendance
        </a>
        <a href="/reports" class="nav-item">
          <span class="nav-icon">📈</span> Reports
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">A</div>
          <div>
            <div class="user-name" id="user-name">Admin</div>
            <div class="user-role">Administrator</div>
          </div>
        </div>
        <button class="btn-logout" id="logout-btn">🚪 Logout</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="topbar">
        <h1>Dashboard</h1>
        <span class="date" id="current-date"></span>
      </div>

      <div class="page-content">
        <!-- Stats -->
        <div class="stats-grid" id="stats-grid">
          <div class="stat-card">
            <div class="stat-icon blue">👥</div>
            <div><div class="stat-value" id="stat-total">—</div><div class="stat-label">Total Staff</div></div>
          </div>
          <div class="stat-card">
            <div class="stat-icon green">✅</div>
            <div><div class="stat-value" id="stat-present">—</div><div class="stat-label">Present Today</div></div>
          </div>
          <div class="stat-card">
            <div class="stat-icon red">❌</div>
            <div><div class="stat-value" id="stat-absent">—</div><div class="stat-label">Absent Today</div></div>
          </div>
          <div class="stat-card">
            <div class="stat-icon purple">🟢</div>
            <div><div class="stat-value" id="stat-checkedin">—</div><div class="stat-label">Checked In Now</div></div>
          </div>
        </div>

        <!-- Today's Attendance Table -->
        <div class="card">
          <div class="card-header">
            <h2>Today's Attendance</h2>
            <button class="btn btn-outline btn-sm" onclick="loadDashboard()">🔄 Refresh</button>
          </div>
          <div class="table-wrap">
            <div id="today-table-container">
              <div class="loading"><div class="spinner"></div><p>Loading...</p></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>

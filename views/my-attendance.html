<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Attendance — Staff Attendance</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="toast-container"></div>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">🏢</div>
        <h2>Staff Attendance</h2>
        <p>Staff Portal</p>
      </div>
      <nav class="sidebar-nav">
        <a href="/staff" class="nav-item">
          <span class="nav-icon">🏠</span> Dashboard
        </a>
        <a href="/my-attendance" class="nav-item active">
          <span class="nav-icon">📋</span> My Attendance
        </a>
        <a href="/my-profile" class="nav-item">
          <span class="nav-icon">👤</span> My Profile
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">S</div>
          <div>
            <div class="user-name" id="user-name">Staff</div>
            <div class="user-role">Staff Member</div>
          </div>
        </div>
        <button class="btn-logout" id="logout-btn">🚪 Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <h1>My Attendance History</h1>
        <span class="date" id="current-date"></span>
      </div>

      <div class="page-content">

        <!-- Summary Stats -->
        <div class="stats-grid" style="margin-bottom:24px;">
          <div class="stat-card">
            <div class="stat-icon green">✅</div>
            <div><div class="stat-value" id="stat-present">—</div><div class="stat-label">Days Present</div></div>
          </div>
          <div class="stat-card">
            <div class="stat-icon red">❌</div>
            <div><div class="stat-value" id="stat-absent">—</div><div class="stat-label">Days Absent (30d)</div></div>
          </div>
          <div class="stat-card">
            <div class="stat-icon blue">⏱️</div>
            <div><div class="stat-value" id="stat-hours">—</div><div class="stat-label">Avg Hours/Day</div></div>
          </div>
        </div>

        <!-- Filter -->
        <div class="filter-bar">
          <div class="form-group">
            <label>Start Date</label>
            <input type="date" id="filter-start">
          </div>
          <div class="form-group">
            <label>End Date</label>
            <input type="date" id="filter-end">
          </div>
          <div style="display:flex; gap:8px; align-items:flex-end;">
            <button class="btn btn-primary" id="search-btn">🔍 Search</button>
            <button class="btn btn-outline" id="clear-btn">✕ Clear</button>
          </div>
        </div>

        <!-- Table -->
        <div class="card">
          <div class="card-header">
            <h2>Attendance Records</h2>
            <span id="record-count" style="color:var(--text-light);font-size:14px;"></span>
          </div>
          <div class="table-wrap">
            <div id="attendance-container">
              <div class="loading"><div class="spinner"></div><p>Loading...</p></div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/my-attendance.js"></script>
</body>
</html>

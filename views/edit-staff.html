<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Staff — Staff Attendance</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="toast-container"></div>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">🏢</div>
        <h2>Staff Attendance</h2>
        <p>Admin Panel</p>
      </div>
      <nav class="sidebar-nav">
        <a href="/admin" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
        <a href="/staff-management" class="nav-item active"><span class="nav-icon">👥</span> Staff Management</a>
        <a href="/attendance" class="nav-item"><span class="nav-icon">📋</span> Attendance</a>
        <a href="/reports" class="nav-item"><span class="nav-icon">📈</span> Reports</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="user-avatar">A</div>
          <div>
            <div class="user-name" id="user-name">Admin</div>
            <div class="user-role">Administrator</div>
          </div>
        </div>
        <button class="btn-logout" id="logout-btn">🚪 Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <h1>Edit Staff</h1>
        <a href="/staff-management" class="btn btn-outline">← Back</a>
      </div>

      <div class="page-content">
        <div class="card" style="max-width:720px;">
          <div class="card-header">
            <h2>Edit Staff Information</h2>
            <span id="emp-id-display" style="color:var(--text-light); font-size:14px;"></span>
          </div>
          <div class="card-body">
            <div id="alert-box"></div>
            <div id="form-container">
              <div class="loading"><div class="spinner"></div><p>Loading...</p></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/edit-staff.js"></script>
</body>
</html>
